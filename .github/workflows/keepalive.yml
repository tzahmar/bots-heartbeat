# GitHub disables scheduled workflows in a repo with no activity for 60 days.
# heartbeat.yml never commits, so on 2026-10-19 it was 4 days from being
# switched off (last commit 2026-08-24), which would have left the Telegram
# statistics/collectibles bots with nothing to restart them after a server
# reboot. This touches one file on the 1st of every month to keep the repo active.
name: keepalive

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > last-alive.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add last-alive.txt
          git commit -m "keepalive $(date -u +%F)"
          git push
