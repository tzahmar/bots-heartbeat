# ==================================================================
# Heartbeat for the two statistics bots running on the Hostinger server.
#
# WHY THIS EXISTS
# The bots are kept alive on the server by ~/bots/keepalive.sh, which runs
# ~/bots/watchdog.sh every 60s and restarts anything that died. That covers
# crashes. What it CANNOT cover is its own death — a server reboot or a
# hosting-side process reaper kills keepalive along with everything else, and
# nothing is left to restart it.
#
# Normally that gap is closed by cron. This Hostinger account has NO working
# cron (verified 2026-08-05: no crontab/crond binary, empty /var/spool/cron,
# and ~/bin/uptime-check.sh had never once been executed since being written).
# So the heartbeat has to come from outside the server. That is this workflow.
#
# It is deliberately in a PUBLIC repo: Actions minutes are unmetered for public
# repositories, so a 10-minute heartbeat is free. The repo holds only this
# file — no bot code, no credentials. The SSH key lives in encrypted repo
# secrets and is a dedicated key used for nothing else.
# ==================================================================
name: bots-heartbeat

on:
  schedule:
    # Requested every 10 minutes, but DO NOT read that as a guarantee.
    # GitHub's scheduler is explicitly best-effort and drops runs under load;
    # measured on this repo over its first 6.7 hours, only 2 scheduled runs
    # actually fired (~1 per 2.75h), not the ~40 that */10 implies.
    #
    # That is acceptable here only because this is a backstop for a rare event
    # (server reboot / host-side reaper). The primary supervisor is keepalive.sh
    # on the server, which checks every 60s and needs no external help. If the
    # bots ever depend on THIS for timely recovery, that assumption is wrong.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # lets you trigger it by hand from the Actions tab

concurrency:
  # never let a slow run overlap the next scheduled one
  group: heartbeat
  cancel-in-progress: false

jobs:
  ensure-bots-running:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          # printf, not echo: OpenSSH rejects a private key that does not end in
          # a newline with a bare "invalid format" and no further explanation.
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key instead of using StrictHostKeyChecking=no, so this
          # cannot be silently pointed at an impostor host.
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Fail here, loudly, if the key did not survive the secret round-trip,
          # rather than surfacing later as an opaque ssh exit 255.
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null && echo "private key parses OK"
          ssh-keygen -lf ~/.ssh/known_hosts | sed 's/^/  pinned host key: /'

      - name: Ensure keepalive + both bots are running
        id: ensure
        run: |
          # keepalive.sh self-guards with flock, so launching it when it is
          # already running is a no-op. It immediately runs watchdog.sh, which
          # restarts whichever bot is down. Both scripts are idempotent, which
          # is what makes it safe to fire this every 10 minutes forever.
          #
          # Capture with "|| rc=$?" rather than letting set -e abort on the
          # assignment: otherwise a failing ssh kills the step before $OUT is
          # ever printed, and the run shows exit 255 with no explanation at all.
          rc=0
          OUT=$(ssh -p "${{ secrets.SSH_PORT }}" \
                    -o BatchMode=yes -o ConnectTimeout=30 \
                    "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
                    'cd ~/bots && setsid nohup bash ~/bots/keepalive.sh </dev/null >/dev/null 2>&1 & sleep 10; bash ~/bots/status.sh' 2>&1) || rc=$?
          echo "--- remote output (ssh exit $rc) ---"
          echo "$OUT"
          echo "------------------------------------"
          if [ "$rc" -ne 0 ]; then
            echo "::error::ssh failed with exit $rc"
            exit 1
          fi

          # status.sh prints one parseable line: keepalive=1 collect=1 ...
          # Counting is done there, on /proc, precisely because a `ps | grep -c`
          # run over ssh counts the ssh command line itself and therefore can
          # never report 0 — it would pass while every bot was dead.
          STATUS=$(echo "$OUT" | grep -E '^keepalive=' | tail -1)
          if [ -z "$STATUS" ]; then
            echo "::error::status.sh produced no parseable output"
            exit 1
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          bad=""
          for kv in $STATUS; do
            name=${kv%%=*}; n=${kv#*=}
            # exactly 1 is the only healthy value: 0 = down, >1 = duplicate
            # processes posting to the same channels twice.
            [ "$n" = "1" ] || bad="$bad $name=$n"
          done
          if [ -n "$bad" ]; then
            echo "::error::unhealthy process count:$bad (each must be exactly 1)"
            exit 1
          fi
          echo "✔ all processes healthy — exactly one of each ($STATUS)"

      - name: Run the site uptime check
        # ~/bin/uptime-check.sh was written 2026-07-11 to watch dailygrowers.com
        # every 30 minutes via cron. There is no cron on this account, so it had
        # never executed once — its atime still equalled its ctime three weeks
        # later, and every outage since went unreported. The script itself is
        # fine (verified by hand), it only ever lacked a scheduler. Now that this
        # workflow is that scheduler, it runs here too.
        #
        # It keeps its own state in ~/bin/.uptime-down and alerts on the first
        # failure and every 6th after, so a long outage stays quiet-ish rather
        # than messaging every 10 minutes.
        #
        # continue-on-error: a site outage must not mark the bot heartbeat as
        # failed — they are independent concerns and the script alerts on its own.
        continue-on-error: true
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" \
              -o BatchMode=yes -o ConnectTimeout=30 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              'bash ~/bin/uptime-check.sh && echo "uptime check ran"'

      - name: Alert Telegram if the heartbeat failed
        # Fires when SSH itself failed (server unreachable) or a bot could not
        # be brought up. The watchdog already alerts on ordinary crash+restart,
        # so this only speaks up about things the server cannot self-heal.
        if: failure()
        run: |
          curl -s -m 20 "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TG_CHAT }}" \
            --data-urlencode "text=🚨 bots-heartbeat FAILED — could not reach the server or a bot would not start. ${{ steps.ensure.outputs.status }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
